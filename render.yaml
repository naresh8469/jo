services:
  - type: web
    name: ai-agent-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: API_SECRET
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
